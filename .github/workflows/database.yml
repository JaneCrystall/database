name: Database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: '2.120.0'
      - name: Validate repository tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Replay migrations and run SQL smoke tests locally
        run: bash scripts/test-database.sh
