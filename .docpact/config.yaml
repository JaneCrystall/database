version: 1
layout: repo
lastReviewedAt: "2026-10-15"
lastReviewedCommit: "697163cba2e52fe0416e37341cd5b532f104b383"
repo:
  id: database
routing:
  intents:
    schema:
      paths: [supabase/migrations/**, tests/sql/**, docs/source-inventory.json]
    tooling:
      paths: [scripts/**, tests/test_*.py, supabase/workspace/**, types/**]
    validation:
      paths: [.github/workflows/**, tests/**, supabase/config.toml]
    governance:
      paths: [AGENTS.md, README*, docs/**, .docpact/**]
coverage:
  include: ["**"]
  exclude:
    - .git/**
    - .docpact/runs/**
    - "**/__pycache__/**"
    - .venv/**
    - .pytest_cache/**
    - .DS_Store
    - supabase/.temp/**
    - supabase/.branches/**
    - supabase/workspace/remote_schema.sql
    - supabase/workspace/global/**
    - supabase/workspace/schemas/**
docInventory:
  include: [AGENTS.md, README.md, README.zh-CN.md, docs/**/*.md, .docpact/config.yaml]
  exclude: [.docpact/runs/**]
freshness:
  warn_after_commits: 50
  warn_after_days: 90
  critical_after_days: 180
rules:
  - id: database-legacy-capture
    scope: repo
    repo: database
    triggers:
      - path: docs/legacy-schema-inventory.json
        kind: schema-provenance
      - path: tests/schema/**
        kind: catalog-contract
      - path: tests/consumers/**
        kind: consumer-qualification
      - path: scripts/test-consumers.sh
        kind: consumer-entrypoint
    requiredDocs:
      - path: docs/legacy-schema-baseline.md
        mode: review_or_update
      - path: docs/validation.md
        mode: review_or_update
    reason: Public schema capture, target isolation and business qualification must share an explicit privacy and completeness contract.
  - id: database-hosted-integration
    scope: repo
    repo: database
    triggers:
      - path: docs/supabase-adoption-evidence.json
        kind: remote-adoption-evidence
      - path: docs/supabase-integration.md
        kind: hosted-runbook
      - path: supabase/config.toml
        kind: branch-configuration
    requiredDocs:
      - path: docs/supabase-integration.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
    reason: Hosted target selection and history adoption must preserve existing database state.
  - id: database-schema
    scope: repo
    repo: database
    triggers:
      - path: supabase/migrations/**
        kind: migration
      - path: supabase/seed.sql
        kind: seed
      - path: tests/sql/**
        kind: sql-test
      - path: docs/source-inventory.json
        kind: provenance
    requiredDocs:
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/validation.md
        mode: review_or_update
    reason: Database contract and migration provenance must match scope and proof.
  - id: database-tooling
    scope: repo
    repo: database
    triggers:
      - path: scripts/**
        kind: tooling
      - path: tests/**
        kind: validation
      - path: supabase/config.toml
        kind: local-runtime
      - path: supabase/workspace/**
        kind: authoring
      - path: types/**
        kind: generated-contract
      - path: .github/**
        kind: ci
      - path: .githooks/**
        kind: governance-gate
      - path: .env.*.example
        kind: environment-example
    requiredDocs:
      - path: docs/development.md
        mode: review_or_update
      - path: docs/validation.md
        mode: review_or_update
    reason: Tool targeting and validation behavior must have executable instructions.
  - id: database-governance
    scope: repo
    repo: database
    triggers:
      - path: AGENTS.md
        kind: contract
      - path: README*
        kind: entry
      - path: docs/**
        kind: documentation
      - path: .docpact/**
        kind: governance
      - path: .gitignore
        kind: publication
      - path: .gitattributes
        kind: source-normalization
      - path: LICENSE
        kind: license
      - path: NOTICE.md
        kind: attribution
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Ownership and standalone governance must remain explicit.

  - id: database-resource-contract
    scope: repo
    repo: database
    triggers:
      - path: supabase/migrations/*_kb_resource*.sql
        kind: resource-schema
      - path: tests/runtime/resource_*.py
        kind: resource-qualification
      - path: tests/schema/resource_boundary.sql
        kind: resource-access-boundary
      - path: tests/upgrade/resource_*.sql
        kind: resource-upgrade
    requiredDocs:
      - path: docs/resource-contract.md
        mode: review_or_update
    reason: Resource identity, approval, publication and recovery must share a versioned gateway contract.

  - id: database-legacy-permissions
    scope: repo
    repo: database
    triggers:
      - path: supabase/migrations/*_narrow_legacy_public_permissions.sql
        kind: legacy-acl
      - path: tests/runtime/legacy_permissions*
        kind: permission-qualification
      - path: tests/schema/legacy_acl_policy.json
        kind: permission-scope
      - path: tests/consumers/unstructure_permissions.py
        kind: worker-consumer
      - path: tests/consumers/unstructure_role_boundary.py
        kind: worker-login-qualification
      - path: tests/consumers/worker_role_contract.json
        kind: worker-role-contract
      - path: tests/consumers/test_worker_role_boundary.py
        kind: worker-target-isolation
      - path: tests/consumers/unstructure_worker_flow.py
        kind: worker-orchestration-qualification
      - path: tests/consumers/test_worker_flow_safety.py
        kind: worker-orchestration-isolation
      - path: tests/consumers/worker_route.ts
        kind: next-worker-orchestration
      - path: tests/consumers/next_consumer.mjs
        kind: next-permission-consumer
    requiredDocs:
      - path: docs/legacy-permissions.md
        mode: review_or_update
      - path: docs/s9-role-consumer-evidence.md
        mode: review_or_update
      - path: docs/s9-development-validation.md
        mode: review_or_update
    reason: Legacy grants, worker identity, compatibility and release gates must remain explicit.
