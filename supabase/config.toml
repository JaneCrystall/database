# Knowledge-base database development only. No hosted project bindings or credentials.
# Configuration reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "tiangong-ai-database"

[api]
enabled = true
port = 57321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 57322
shadow_port = 57320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 57329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 57323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 57324

[storage]
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 57327
backend = "postgres"
